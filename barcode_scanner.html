<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D Barcode Scanner Parser</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Sora:wght@400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --bg2: #161b27;
    --bg3: #1e2535;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.15);
    --text: #e8eaf0;
    --text2: #8b92a8;
    --text3: #555e78;
    --accent: #3d7eff;
    --accent-dim: rgba(61,126,255,0.12);
    --green: #22c55e;
    --green-dim: rgba(34,197,94,0.12);
    --amber: #f59e0b;
    --amber-dim: rgba(245,158,11,0.12);
    --purple: #a78bfa;
    --purple-dim: rgba(167,139,250,0.12);
    --pink: #f472b6;
    --pink-dim: rgba(244,114,182,0.12);
    --teal: #2dd4bf;
    --teal-dim: rgba(45,212,191,0.12);
    --gray-dim: rgba(255,255,255,0.06);
    --radius: 10px;
    --radius-sm: 6px;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Sora', sans-serif;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .page {
    max-width: 900px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 2rem;
  }
  .logo {
    width: 44px; height: 44px;
    background: var(--accent-dim);
    border: 1px solid rgba(61,126,255,0.3);
    border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .logo svg { width: 22px; height: 22px; }
  .header-text h1 { font-size: 20px; font-weight: 600; color: var(--text); }
  .header-text p { font-size: 13px; color: var(--text2); margin-top: 2px; }

  /* Input card */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.25rem;
  }

  .input-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .input-label::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    display: inline-block;
    box-shadow: 0 0 6px var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
  }

  textarea {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.6;
    padding: 12px 14px;
    resize: vertical;
    min-height: 110px;
    outline: none;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: var(--border2); }
  textarea::placeholder { color: var(--text3); }
  @keyframes flashClear {
    0%   { border-color: var(--green); box-shadow: 0 0 0 2px rgba(34,197,94,0.25); }
    100% { border-color: var(--border); box-shadow: none; }
  }
  textarea.flash-clear { animation: flashClear 0.4s ease-out forwards; }

  .btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  button {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border2);
    cursor: pointer;
    background: var(--bg3);
    color: var(--text);
    transition: all 0.15s;
  }
  button:hover { background: var(--bg); border-color: rgba(255,255,255,0.25); }
  button:active { transform: scale(0.98); }

  .btn-parse {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-parse:hover { background: #5590ff; border-color: #5590ff; }

  .btn-export {
    background: var(--green-dim);
    border-color: rgba(34,197,94,0.3);
    color: var(--green);
  }
  .btn-export:hover { background: rgba(34,197,94,0.2); }

  .btn-sample {
    background: var(--amber-dim);
    border-color: rgba(245,158,11,0.3);
    color: var(--amber);
  }
  .btn-clear { margin-left: auto; }

  /* Legend */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 1.25rem;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text2);
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 10px;
  }
  .legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  /* Table section */
  .table-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .table-title { font-size: 14px; font-weight: 500; color: var(--text); }
  .row-count {
    font-size: 12px;
    color: var(--text2);
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
  }

  .table-wrapper {
    overflow-x: auto;
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 500px;
  }

  /* Horizontal layout: fields = columns */
  thead tr { background: var(--bg3); }

  th {
    padding: 10px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    white-space: nowrap;
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  th:last-child { border-right: none; }

  td {
    padding: 11px 16px;
    border-right: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    word-break: break-all;
    vertical-align: top;
  }
  td:last-child { border-right: none; }

  tbody tr { background: var(--bg2); }
  tbody tr:nth-child(even) { background: var(--bg); }
  tbody tr:hover td { background: var(--bg3); }

  .th-part    { color: var(--accent);  }
  .th-batch   { color: var(--green);   }
  .th-lot     { color: var(--purple);  }
  .th-reel    { color: var(--amber);   }
  .th-serial  { color: var(--pink);    }
  .th-other   { color: var(--text2);   }

  .cell-part   { background: var(--accent-dim) !important; }
  .cell-batch  { background: var(--green-dim)  !important; }
  .cell-lot    { background: var(--purple-dim) !important; }
  .cell-reel   { background: var(--amber-dim)  !important; }
  .cell-serial { background: var(--pink-dim)   !important; }
  .cell-other  { background: var(--gray-dim)   !important; }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    font-size: 12px;
    color: var(--text3);
    padding: 0 2px;
  }

  /* Empty / hidden */
  .hidden { display: none !important; }

  .empty-hint {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text3);
    font-size: 14px;
  }
  .empty-hint svg { opacity: 0.3; margin-bottom: 12px; }

  /* Divider label */
  .section-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }
</style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#3d7eff" stroke-width="1.8" stroke-linecap="round">
        <rect x="3" y="3" width="5" height="5" rx="1"/>
        <rect x="16" y="3" width="5" height="5" rx="1"/>
        <rect x="3" y="16" width="5" height="5" rx="1"/>
        <path d="M21 16h-3a2 2 0 0 0-2 2v3"/>
        <path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/>
        <path d="M3 12h.01"/><path d="M12 3h.01"/>
        <path d="M12 16v.01"/><path d="M16 12h1"/>
        <path d="M21 12v.01"/><path d="M12 21v-1"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>2D Barcode Scanner Parser</h1>
      <p>Scan karo → automatic table aur Excel export</p>
    </div>
  </div>

  <!-- Input Card -->
  <div class="card">
    <div class="input-label">Barcode data — scan ya paste karein</div>
    <textarea id="barcodeInput" placeholder="Barcode scanner se yahan scan karein ya text paste karein...&#10;&#10;Enter dabao ya Parse button click karo..."></textarea>
    <div class="btn-row">
      <button class="btn-parse" onclick="parseBarcode()">&#9654; Parse</button>
      <button class="btn-sample" onclick="loadSample()">&#128196; Sample load</button>
      <button class="btn-export hidden" id="exportBtn" onclick="exportExcel()">&#8595; Excel export</button>
      <button class="btn-clear" onclick="clearAll()">&#215; Clear</button>
    </div>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item"><span class="legend-dot" style="background:#3d7eff;"></span>P = Part Number</div>
    <div class="legend-item"><span class="legend-dot" style="background:#22c55e;"></span>1P = Batch Number</div>
    <div class="legend-item"><span class="legend-dot" style="background:#a78bfa;"></span>1T = Lot Number</div>
    <div class="legend-item"><span class="legend-dot" style="background:#f59e0b;"></span>7Q = Full Reel Qty</div>
    <div class="legend-item"><span class="legend-dot" style="background:#f472b6;"></span>S = Serial Number</div>
    <div class="legend-item"><span class="legend-dot" style="background:#555e78;"></span>Other = Unrecognized</div>
  </div>

  <!-- Table Section -->
  <div id="tableSection" class="hidden">
    <div class="table-header-row">
      <div class="table-title">Parsed result — horizontal view</div>
      <div id="rowCount" class="row-count"></div>
    </div>
    <div class="table-wrapper">
      <table id="dataTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="status-bar">
      <span id="statusText"></span>
      <span id="scanTime"></span>
    </div>
  </div>

  <!-- Empty hint -->
  <div id="emptyHint" class="hidden empty-hint">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
    <div>Koi data parse nahi hua. Input check karein.</div>
  </div>

</div>

<script>
const PREFIX_MAP = [
  { prefix: '1P', field: 'Batch Number', cls: 'batch' },
  { prefix: '1T', field: 'Lot Number',   cls: 'lot'   },
  { prefix: '7Q', field: 'Full Reel Qty',cls: 'reel'  },
  { prefix: 'P',  field: 'Part Number',  cls: 'part'  },
  { prefix: 'S',  field: 'Serial Number',cls: 'serial'},
];

let parsedData = [];

function loadSample() {
  document.getElementById('barcodeInput').value =
`P511-500567C
1PGRM188R60G476ME15D|
1TWG5707AH6|7Q4000+EA|
SASA250802052565001|21 PMURATA|
9D20250716|4LCN|7E1`;
  parseBarcode();
}

function tokenize(raw) {
  return raw.replace(/\r/g, '').replace(/\n/g, '|')
    .split('|').map(s => s.trim()).filter(s => s.length > 0);
}

function matchPrefix(token) {
  for (const e of PREFIX_MAP) {
    if (token.startsWith(e.prefix)) {
      const val = token.slice(e.prefix.length).trim();
      if (val.length > 0) return { ...e, value: val };
    }
  }
  return null;
}

function parseBarcode() {
  const raw = document.getElementById('barcodeInput').value;
  if (!raw.trim()) return;
  const t0 = performance.now();
  const tokens = tokenize(raw);
  parsedData = [];
  let otherIdx = 0;

  for (const token of tokens) {
    const m = matchPrefix(token);
    if (m) {
      parsedData.push({ field: m.field, prefix: m.prefix, value: m.value, cls: m.cls });
    } else {
      otherIdx++;
      const label = otherIdx === 1 ? 'Other' : `Other ${otherIdx}`;
      parsedData.push({ field: label, prefix: '—', value: token, cls: 'other' });
    }
  }

  const elapsed = (performance.now() - t0).toFixed(1);
  renderTable(elapsed);

  // Auto-clear scanbox and refocus for next scan
  const inp = document.getElementById('barcodeInput');
  inp.value = '';
  inp.classList.add('flash-clear');
  setTimeout(() => { inp.classList.remove('flash-clear'); inp.focus(); }, 400);
}

function renderTable(elapsed) {
  const section = document.getElementById('tableSection');
  const hint    = document.getElementById('emptyHint');
  const exportBtn = document.getElementById('exportBtn');

  if (!parsedData.length) {
    section.classList.add('hidden');
    hint.classList.remove('hidden');
    exportBtn.classList.add('hidden');
    return;
  }

  hint.classList.add('hidden');
  section.classList.remove('hidden');
  exportBtn.classList.remove('hidden');

  const known  = parsedData.filter(r => r.cls !== 'other').length;
  const others = parsedData.length - known;

  document.getElementById('rowCount').textContent = parsedData.length + ' columns';
  document.getElementById('statusText').textContent =
    known + ' known field' + (known !== 1 ? 's' : '') +
    ' • ' + others + ' unrecognized token' + (others !== 1 ? 's' : '');
  document.getElementById('scanTime').textContent = 'Parsed in ' + elapsed + ' ms';

  // Build horizontal table: each field = one column
  const head = document.getElementById('tableHead');
  const body = document.getElementById('tableBody');

  // Header row: field names
  let thHtml = '<tr>';
  parsedData.forEach(r => {
    thHtml += `<th class="th-${r.cls}">${r.field}<br><span style="font-family:var(--mono);font-size:10px;opacity:0.6;font-weight:400;">${r.prefix !== '—' ? '[' + r.prefix + ']' : ''}</span></th>`;
  });
  thHtml += '</tr>';
  head.innerHTML = thHtml;

  // Single data row: values
  let tdHtml = '<tr>';
  parsedData.forEach(r => {
    tdHtml += `<td class="cell-${r.cls}">${escHtml(r.value)}</td>`;
  });
  tdHtml += '</tr>';
  body.innerHTML = tdHtml;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function exportExcel() {
  if (!parsedData.length) return;
  // Header row = field names
  const headers = parsedData.map(r => r.field);
  // Data row = values
  const values  = parsedData.map(r => r.value);
  // Prefix row
  const prefixes = parsedData.map(r => r.prefix);

  const ws = XLSX.utils.aoa_to_sheet([headers, values, prefixes]);

  // Column widths
  ws['!cols'] = parsedData.map(() => ({ wch: 22 }));

  // Style header row bold (basic)
  const range = XLSX.utils.decode_range(ws['!ref']);
  for (let C = range.s.c; C <= range.e.c; C++) {
    const addr = XLSX.utils.encode_cell({ r: 0, c: C });
    if (!ws[addr]) continue;
    ws[addr].s = { font: { bold: true } };
  }

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Barcode Data');
  XLSX.writeFile(wb, 'barcode_data.xlsx');
}

function clearAll() {
  document.getElementById('barcodeInput').value = '';
  document.getElementById('tableSection').classList.add('hidden');
  document.getElementById('emptyHint').classList.add('hidden');
  document.getElementById('exportBtn').classList.add('hidden');
  parsedData = [];
}

// Auto-parse on Enter (without Shift)
document.getElementById('barcodeInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); parseBarcode(); }
});
</script>
</body>
</html>
